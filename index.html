<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taewon Kwon · twdev.kr</title>
<meta name="description" content="Taewon Kwon — AI Application Engineer / Producer. Projects on GitHub.">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917; --line: #292524; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 2rem; margin: 0; }
  .bio { color: var(--muted); margin: 4px 0 16px; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 16px; }
  .links a:hover { text-decoration: underline; }
  h2 { font-size: 1rem; color: var(--muted); font-weight: 600; margin: 48px 0 16px; }
  #repos { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 8px; }
  .card h3 { margin: 0; font-size: 1.05rem; word-break: break-word; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  .status { color: var(--muted); }
  footer { margin-top: 64px; font-size: .82rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Taewon Kwon</h1>
  <p class="bio">AI Application Engineer / Producer</p>
  <nav class="links">
    <a href="https://github.com/cidtw">GitHub</a>
    <a href="mailto:tw.kwon@twdev.kr">tw.kwon@twdev.kr</a>
  </nav>

  <h2>Projects</h2>
  <div id="repos"><p class="status">불러오는 중…</p></div>

  <footer>© Taewon Kwon · 목록은 GitHub에서 실시간으로 가져옵니다.</footer>
</main>
<script>
// ponytail: unauthenticated GitHub API (60 req/h per visitor IP); bake a repos.json at build time if that ever bites.
const USER = 'cidtw';
const box = document.getElementById('repos');

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter(Boolean));
  return e;
}

fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(repos => {
    const list = repos.filter(r => !r.fork && r.name !== `${USER}.github.io`);
    box.replaceChildren(...list.map(r => el('article', { className: 'card' },
      el('h3', {}, el('a', { href: r.html_url, textContent: r.name })),
      el('p', { textContent: r.description || '' }),
      el('div', { className: 'meta' },
        r.language && el('span', { textContent: r.language }),
        r.stargazers_count ? el('span', { textContent: `★ ${r.stargazers_count}` }) : null,
        el('span', { textContent: new Date(r.pushed_at).toLocaleDateString('ko-KR') }),
        r.homepage && el('a', { href: r.homepage, textContent: 'Live ↗' }),
      ),
    )));
  })
  .catch(() => {
    box.replaceChildren(el('p', { className: 'status' }, '목록을 불러오지 못했습니다. ',
      el('a', { href: `https://github.com/${USER}?tab=repositories`, textContent: 'GitHub에서 보기' })));
  });
</script>
</body>
</html>
